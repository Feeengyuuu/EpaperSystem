[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "inkypi-weather/package/InkyPi/src"
explicit_package_bases = true
files = [
    "inkypi-weather/package/InkyPi/src/runtime/refresh_planning.py",
    "inkypi-weather/package/InkyPi/src/runtime/plugin_execution.py",
    "inkypi-weather/package/InkyPi/src/plugins/registry.py",
]
# Analyze imported annotations without making this pilot a legacy-wide migration.
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
