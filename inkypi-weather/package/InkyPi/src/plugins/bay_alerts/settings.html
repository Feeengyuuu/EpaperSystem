<input type="hidden" name="refreshOnDisplay" id="refreshOnDisplay" value="false">
<div class="form-group">
  <label class="form-label" for="latitude">家的位置（纬度, 经度）</label>
  <div style="display:flex; gap:8px;">
    <input class="form-control" type="number" step="0.0001" min="35" max="40" name="latitude" id="latitude" placeholder="37.5485">
    <input class="form-control" type="number" step="0.0001" min="-125" max="-119" name="longitude" id="longitude" placeholder="-121.9886">
  </div>
  <small>留空为弗里蒙特。地图上画出家的位置，地震和野火都显示离家距离。</small>
</div>
<div class="form-group">
  <label class="form-label" for="homeLabel">家的标签</label>
  <input class="form-control" name="homeLabel" id="homeLabel" value="家" maxlength="8">
</div>
<div class="form-group">
  <label class="form-label" for="radiusKm">地震搜索半径（公里）</label>
  <input class="form-control" type="number" name="radiusKm" id="radiusKm" value="150" min="30" max="300">
  <small>USGS 过去 7 天的地震；地图只画落在湾区范围内的。</small>
</div>
<div class="form-group">
  <label class="form-label" for="minMagnitude">最小震级</label>
  <input class="form-control" type="number" step="0.1" name="minMagnitude" id="minMagnitude" value="1.5" min="1" max="4">
</div>
<div class="form-group">
  <label class="form-label">关注的县（美国国家气象局预警）</label>
  <div id="countyList" style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:4px;">
    {% for code, name in bay_counties %}
    <label><input type="checkbox" class="county" value="{{ code }}" checked> {{ name }}</label>
    {% endfor %}
  </div>
  <input type="hidden" name="counties" id="counties">
</div>
<div class="form-group">
  <label class="form-label" for="fontFamily">字体</label>
  <select name="fontFamily" id="fontFamily">
    {% for font_name in available_fonts %}<option value="{{ font_name }}">{{ font_name }}</option>{% endfor %}
  </select>
</div>
<div class="form-group">
  <label><input type="checkbox" name="forceRefresh" id="forceRefresh"> 下次刷新重新获取全部数据</label>
  <small>预警和地震每 15 分钟更新，加州自然事件（NASA EONET）每 3 小时更新；轮播只读本地缓存。</small>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const saved = typeof pluginSettings !== 'undefined' ? pluginSettings : {};
  for (const key of ['latitude', 'longitude', 'homeLabel', 'radiusKm', 'minMagnitude', 'fontFamily', 'forceRefresh']) {
    const el = document.getElementById(key);
    if (saved[key] === undefined) {
      if (key === 'fontFamily') el.value = 'Microsoft YaHei';
      continue;
    }
    if (el.type === 'checkbox') el.checked = [true, 'true', 'on', '1'].includes(saved[key]);
    else el.value = saved[key];
  }
  const hidden = document.getElementById('counties');
  const boxes = Array.from(document.querySelectorAll('.county'));
  if (saved.counties) {
    const chosen = String(saved.counties).split(',');
    boxes.forEach((box) => { box.checked = chosen.includes(box.value); });
  }
  const sync = () => { hidden.value = boxes.filter((box) => box.checked).map((box) => box.value).join(','); };
  boxes.forEach((box) => box.addEventListener('change', sync));
  sync();
});
</script>
