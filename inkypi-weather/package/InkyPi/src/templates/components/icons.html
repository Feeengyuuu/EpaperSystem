{#- Inline line icons (24px grid, stroke = currentColor). -#}

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'now' -%}
<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>

<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>

<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M16 7l3 3M14 9l2 2"/>

<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>

<path d="M7 4.5v15l12.5-7.5z"/>

<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>

<path d="M8 6h13M8 12h13M8 18h13M3.5 6h0M3.5 12h0M3.5 18h0"/>

<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>

<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>
{%- elif name == 'download' -%}
<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == 'power' -%}
<path d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0"/>
{%- elif name == 'reboot' -%}
<path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/>
{%- elif name == 'external' -%}
<path d="M14 4h6v6M10 14L20 4M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/>
{%- elif name == 'activity' -%}
<path d="M3 12h4l3-8 4 16 3-8h4"/>
{%- elif name == 'check' -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'alert' -%}
<path d="M12 9v4M12 17h0"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
{%- elif name == 'user' -%}
<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- endif -%}
</svg>
{%- endmacro %}
